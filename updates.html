<style>
  :root{
    --ink:#14241C; --paper:#FBF6EA; --forest:#1F4732; --forest-dark:#132E20;
    --marigold:#E8A33D; --clay:#A64B2A; --clay-dark:#8A3D22;
    --line:#D8CBA8; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--forest); color:var(--ink); font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--marigold); color:var(--forest-dark);}

  header.top{
    background:var(--forest);
    background-image:radial-gradient(circle at 8% 20%, rgba(255,255,255,0.04) 0, transparent 40%),
                      radial-gradient(circle at 92% 80%, rgba(255,255,255,0.03) 0, transparent 45%);
    color:var(--paper); padding:30px 20px 22px; text-align:center;
  }
  header.top .eyebrow{font-family:'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; font-size:11.5px; color:var(--marigold); margin-bottom:10px;}
  header.top .brand-mark{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,5vw,40px); margin:0 0 8px; letter-spacing:-0.01em;}
  header.top .brand-mark a{color:inherit; text-decoration:none;}
  header.top .brand-mark a:hover{opacity:.85;}
  header.top p{margin:0 auto; max-width:480px; color:#DCE7DD; font-size:14.5px; line-height:1.5;}

  main{max-width:700px; margin:0 auto; padding:28px 16px 80px;}

  .post-card{background:var(--paper); border-radius:var(--radius); padding:30px 28px; box-shadow:0 10px 30px rgba(0,0,0,0.18); margin-bottom:22px;}
  .post-card h1{font-family:'Fraunces',serif; font-size:24px; margin:0 0 6px; color:var(--forest-dark); line-height:1.25;}
  .post-card .post-date{font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase; color:#8a7f65; margin:0 0 16px;}
  .post-card img{width:100%; max-height:360px; object-fit:cover; border-radius:10px; margin:0 0 16px; display:block;}
  .post-card p{font-size:15px; line-height:1.65; color:#3c3628; margin:0 0 14px;}
  .post-card p:last-of-type{margin-bottom:0;}
  .post-card a{color:var(--clay-dark); font-weight:600;}
  .post-card a:hover{color:var(--clay);}

  .btn{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; border:none; border-radius:9px; padding:11px 20px; cursor:pointer; transition:.15s ease; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;}
  .btn-clay{background:var(--clay); color:#fff;} .btn-clay:hover{background:var(--clay-dark);}
  .btn:hover{transform:translateY(-1px);}
  .btn:focus-visible{outline:3px solid var(--marigold); outline-offset:2px;}
  .post-link-row{margin-top:18px;}

  .empty{background:var(--paper); border-radius:var(--radius); padding:40px 26px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.18);}
  .empty h1{font-family:'Fraunces',serif; font-size:22px; color:var(--forest-dark); margin:0 0 8px;}
  .empty p{color:#5b5142; font-size:14.5px; margin:0;}

  .cta-row{margin-top:26px; text-align:center;}

  footer{text-align:center; color:#B9CBBD; font-size:12px; padding:24px 16px 40px; font-family:'IBM Plex Mono',monospace;}
  footer a{color:inherit;}
</style>

<body>

<header class="top">
  <div class="eyebrow">Dogs &amp; Cats · Near You</div>
  <p class="brand-mark"><a href="/" title="Back to the PetMatch homepage">PetMatch</a></p>
  <p>News and updates from the PetMatch team.</p>
</header>

<main>
  <div id="postsWrap">
    <div class="empty"><h1>Loading updates…</h1></div>
  </div>

  <div class="cta-row">
    <a class="btn btn-clay" href="/">List Your Pet</a>
  </div>
</main>

<footer>PETMATCH · A simple directory, not a broker. Meet safely, and check health and vaccination records before any pairing.<br>Contact: <a href="mailto:hello@petmatch.fit">hello@petmatch.fit</a> · <a href="/">Home</a> · <a href="/about">About</a></footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://pnawdtpavemfjzdsevey.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CHwFvmImO-SxEMDO52uWeA_WUuU1k2l';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Plain-text body -> paragraphs split on blank lines, with bare URLs
// turned into links. Keeps the writing experience a simple textarea
// (no rich-text editor) while still reading naturally on the page.
const URL_RE = /(https?:\/\/[^\s<]+)/g;
function renderBody(body){
  return String(body ?? '')
    .split(/\n\s*\n/)
    .map(para => para.trim())
    .filter(Boolean)
    .map(para => {
      const escaped = escapeHtml(para).replace(/\n/g, '<br>');
      const linked = escaped.replace(URL_RE, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
      return `<p>${linked}</p>`;
    })
    .join('');
}

function fmtDate(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
}

async function loadPosts(){
  const wrap = document.getElementById('postsWrap');
  const { data, error } = await supabase
    .from('posts')
    .select('*')
    .eq('published', true)
    .order('created_at', { ascending:false });

  if(error){
    console.error('Failed to load posts:', error.message);
    wrap.innerHTML = `<div class="empty"><h1>Nothing posted yet</h1><p>Check back soon for news from the PetMatch team.</p></div>`;
    return;
  }
  if(!data || data.length === 0){
    wrap.innerHTML = `<div class="empty"><h1>Nothing posted yet</h1><p>Check back soon for news from the PetMatch team.</p></div>`;
    return;
  }

  wrap.innerHTML = data.map(p => `
    <article class="post-card">
      <h1>${escapeHtml(p.title)}</h1>
      <p class="post-date">${fmtDate(p.created_at)}</p>
      ${p.image_url ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.title)}" loading="lazy">` : ''}
      ${renderBody(p.body)}
      ${p.link_url ? `<div class="post-link-row"><a class="btn btn-clay" href="${escapeHtml(p.link_url)}" target="_blank" rel="noopener">${escapeHtml(p.link_label || 'Read more')}</a></div>` : ''}
    </article>
  `).join('');
}

function getVisitorId(){
  let id = localStorage.getItem('petmatch_visitor_id');
  if(!id){
    id = crypto.randomUUID();
    localStorage.setItem('petmatch_visitor_id', id);
  }
  return id;
}
supabase.from('page_views').insert({
  session_id: getVisitorId(),
  path: window.location.pathname,
  referrer: document.referrer || null
}).then(()=>{});

loadPosts();
</script>
</body>
