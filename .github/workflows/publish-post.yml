name: Submit drafted post for review

# Takes whatever is sitting in content/ready/ — normally put there by
# the "PetMatch Content Writer" cloud routine — and inserts it into
# Supabase as a DRAFT (published=false). This is the only piece of
# the pipeline with real network access to Supabase — the CCR sandbox
# can't reach it — so this workflow does the actual insert. It does
# NOT go live on its own: a human approves it from the admin panel's
# Posts tab (already wired for realtime + a Publish button, no new
# code needed there), same as any other manually-added post. Moves
# submitted files to content/submitted/ afterward (audit trail, stops
# it re-firing) and opens a GitHub issue as the "a draft is waiting
# for you" notification, since GitHub Actions has no way to send a
# Claude push notification directly.
#
# Primary trigger is the weekly cron (proven reliable in this repo's
# other pipelines); the push trigger on content/ready/** is a
# best-effort bonus for faster turnaround — it didn't fire in initial
# testing (2026-08-26) but did fire cleanly on a later run the same
# day, so it may just have needed first-run propagation. Cron stays
# as the reliable fallback either way.

on:
  schedule:
    - cron: "0 9 * * 3" # Wednesday 09:00 UTC — 1h after the writer's cron
  push:
    branches: [main]
    paths:
      - "content/ready/**"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: pnawdtpavemfjzdsevey

      - name: Submit each ready draft
        id: submit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DRAFT_SUMMARY=""

          for draft in content/ready/*.json; do
            echo "Submitting $draft"
            SQL_FILE=$(mktemp)
            python3 scripts/build_publish_sql.py "$draft" "$SQL_FILE"

            RESULT=$(supabase --output-format json db query --linked -f "$SQL_FILE")
            echo "$RESULT"

            TITLE=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])[0]['title'])" "$RESULT")

            mkdir -p content/submitted
            git mv "$draft" "content/submitted/$(basename "$draft")"

            DRAFT_SUMMARY="${DRAFT_SUMMARY}- **${TITLE}**\n"
          done

          {
            echo "summary<<PMEOF"
            echo -e "$DRAFT_SUMMARY"
            echo "PMEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit move to submitted/
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Mark post(s) as submitted for review"
            git push
          fi

      - name: Open notification issue
        if: steps.submit.outputs.summary != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "🐾 PetMatch draft(s) awaiting your approval" \
            --body "$(printf 'Ready for review in the admin panel (Posts tab — https://petmatch.fit/admin):\n\n%s' "${{ steps.submit.outputs.summary }}")" \
            --repo "${{ github.repository }}"
