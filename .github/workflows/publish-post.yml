name: Publish drafted post

# Triggered when the "PetMatch Content Writer" cloud routine pushes a
# draft to content/ready/. This is the only piece of the pipeline with
# real network access to Supabase — the CCR sandbox can't reach it —
# so this workflow does the actual insert. Moves the file to
# content/published/ afterward (audit trail, and stops it re-firing)
# and opens a GitHub issue as the "a post just went live" notification,
# since GitHub Actions has no way to send a Claude push notification
# directly.

on:
  push:
    branches: [main]
    paths:
      - "content/ready/**"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: pnawdtpavemfjzdsevey

      - name: Publish each ready draft
        id: publish
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          PUBLISHED_SUMMARY=""

          for draft in content/ready/*.json; do
            echo "Publishing $draft"
            SQL_FILE=$(mktemp)
            python3 scripts/build_publish_sql.py "$draft" "$SQL_FILE"

            RESULT=$(supabase --output-format json db query --linked -f "$SQL_FILE")
            echo "$RESULT"

            TITLE=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])[0]['title'])" "$RESULT")
            POST_ID=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])[0]['id'])" "$RESULT")

            mkdir -p content/published
            git mv "$draft" "content/published/$(basename "$draft")"

            PUBLISHED_SUMMARY="${PUBLISHED_SUMMARY}- **${TITLE}** — https://petmatch.fit/updates/${POST_ID}\n"
          done

          {
            echo "summary<<PMEOF"
            echo -e "$PUBLISHED_SUMMARY"
            echo "PMEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit move to published/
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Mark post(s) as published"
            git push
          fi

      - name: Open notification issue
        if: steps.publish.outputs.summary != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "🐾 New PetMatch post published" \
            --body "$(printf '%s' "${{ steps.publish.outputs.summary }}")" \
            --repo "${{ github.repository }}"
