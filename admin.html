<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetMatch Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/petmatch-mark-512.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --ink:#14241C; --paper:#FBF6EA; --forest:#1F4732; --forest-dark:#132E20;
    --marigold:#E8A33D; --clay:#A64B2A; --clay-dark:#8A3D22;
    --line:#D8CBA8; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:#EFE9D8; color:var(--ink); font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--marigold); color:var(--forest-dark);}

  header.top{
    background:var(--forest); color:var(--paper); padding:18px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  header.top .brand{display:flex; align-items:baseline; gap:10px;}
  header.top h1{font-family:'Fraunces',serif; font-weight:600; font-size:20px; margin:0;}
  header.top .eyebrow{font-family:'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; font-size:10.5px; color:var(--marigold);}
  header.top .who{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#DCE7DD;}
  header.top .authbox{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  header.top input{border:none; border-radius:999px; padding:8px 14px; font-size:13px; min-width:180px;}

  .btn{font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; border:none; border-radius:9px; padding:9px 16px; cursor:pointer; transition:.15s;}
  .btn-clay{background:var(--clay); color:#fff;} .btn-clay:hover{background:var(--clay-dark);}
  .btn-forest{background:var(--forest); color:#fff;} .btn-forest:hover{background:var(--forest-dark);}
  .btn-ghost{background:transparent; border:1.5px solid var(--forest); color:var(--forest);}
  .btn-ghost:hover{background:var(--forest); color:#fff;}
  .btn-outline-light{background:transparent; border:1.5px solid rgba(255,255,255,0.4); color:#DCE7DD;}
  .btn-outline-light:hover{border-color:var(--marigold); color:var(--marigold);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-sm{padding:6px 10px; font-size:11px;}

  .tabs{display:flex; gap:6px; background:var(--forest-dark); padding:10px 20px; flex-wrap:wrap;}
  .tab-btn{font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; background:transparent; border:1px solid rgba(255,255,255,0.25); color:#CFE0D2; padding:9px 18px; border-radius:999px; cursor:pointer;}
  .tab-btn:hover{border-color:var(--marigold); color:var(--marigold);}
  .tab-btn.active{background:var(--marigold); color:var(--forest-dark); border-color:var(--marigold); font-weight:600;}

  main{max-width:1100px; margin:0 auto; padding:26px 18px 80px;}
  .panel{display:none;} .panel.active{display:block;}

  .gate{max-width:440px; margin:60px auto; background:var(--paper); border-radius:var(--radius); padding:32px 26px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.14);}
  .gate h2{font-family:'Fraunces',serif; color:var(--forest-dark); margin:0 0 8px;}
  .gate p{color:#5b5142; font-size:14px; margin:0 0 18px; line-height:1.5;}
  .gate input{width:100%; padding:10px 14px; border:1.5px solid var(--line); border-radius:9px; font-size:14px; margin-bottom:12px;}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;}
  .toolbar input, .toolbar select{font-family:'Work Sans',sans-serif; font-size:13.5px; padding:9px 12px; border:1.5px solid var(--line); border-radius:9px; background:#fff; color:var(--ink);}
  .checkline{display:flex; align-items:center; gap:6px; font-size:13px; color:#4a4437;}
  .count-line{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#5b5142; margin:0 0 12px;}

  .table-wrap{background:var(--paper); border-radius:var(--radius); box-shadow:0 8px 20px rgba(0,0,0,0.1); overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:#8a7f65; padding:12px 14px; border-bottom:1.5px solid var(--line); white-space:nowrap;}
  td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(31,71,50,0.035);}
  td.muted{color:#8a7f65;}
  td.nowrap{white-space:nowrap;}

  .badge{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:999px; display:inline-block; white-space:nowrap;}
  .badge.pending{background:rgba(232,163,61,0.22); color:#8a5f16;}
  .badge.approved{background:rgba(31,71,50,0.14); color:var(--forest);}
  .badge.rejected{background:rgba(166,75,42,0.14); color:var(--clay-dark);}
  .badge.open{background:rgba(166,75,42,0.14); color:var(--clay-dark);}
  .badge.resolved{background:rgba(31,71,50,0.14); color:var(--forest);}
  .badge.dismissed{background:rgba(0,0,0,0.08); color:#5b5142;}
  .badge.partner{background:rgba(232,163,61,0.28); color:#8a5f16;}
  .badge.admin{background:rgba(60,110,156,0.14); color:#3C6E9C;}

  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .empty{padding:40px 20px; text-align:center; color:#5b5142;}
  .empty h3{font-family:'Fraunces',serif; color:var(--forest-dark); margin:0 0 6px;}

  a.wa-link{color:var(--forest); font-weight:600; text-decoration:none;}
  a.wa-link:hover{text-decoration:underline;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-bottom:22px;}
  .stat-card{background:var(--paper); border-radius:var(--radius); padding:16px 18px; box-shadow:0 8px 20px rgba(0,0,0,0.1);}
  .stat-card .num{font-family:'Fraunces',serif; font-size:28px; color:var(--forest-dark); line-height:1;}
  .stat-card .label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:#8a7f65; margin-top:6px;}

  .postform{background:var(--paper); border-radius:var(--radius); padding:22px 20px; margin-bottom:20px; box-shadow:0 8px 20px rgba(0,0,0,0.1);}
  .postform h2{font-family:'Fraunces',serif; margin:0 0 16px; color:var(--forest-dark); font-size:19px;}
  .postform .field{margin-bottom:14px;}
  .postform label{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.03em; text-transform:uppercase; color:#8a7f65; margin-bottom:5px;}
  .postform input[type=text], .postform input[type=url], .postform textarea{width:100%; padding:9px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; background:#fff; color:var(--ink);}
  .postform textarea{resize:vertical;}
  .postform .field-row{display:flex; gap:14px; flex-wrap:wrap;}
  .postform .field-row .field{flex:1; min-width:200px;}
  .postform .actions-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .postform .msg{font-size:13px; color:#5b5142; margin:10px 0 0;}
  .post-thumb-preview{max-width:180px; border-radius:8px; display:block; margin-top:8px;}
  .post-thumb{width:36px; height:36px; border-radius:6px; object-fit:cover; vertical-align:middle; margin-right:8px;}

  .visit-chart{display:flex; align-items:flex-end; gap:6px; height:120px;}
  .visit-bar{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%;}
  .visit-bar .bar{width:100%; background:var(--forest); border-radius:4px 4px 0 0; min-height:2px;}
  .visit-bar .bar-label{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:#8a7f65; white-space:nowrap;}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div>
      <div class="eyebrow"><a href="/" style="color:inherit; text-decoration:none" title="Back to the PetMatch homepage">PetMatch</a></div>
      <h1>Admin</h1>
    </div>
  </div>
  <div class="authbox" id="authbox"><!-- filled by JS --></div>
</header>

<div class="tabs" id="tabs" style="display:none">
  <button class="tab-btn active" data-tab="listings">Listings</button>
  <button class="tab-btn" data-tab="users">Users</button>
  <button class="tab-btn" data-tab="partners">Partners</button>
  <button class="tab-btn" data-tab="reports">Reports</button>
  <button class="tab-btn" data-tab="subscribers">Subscribers</button>
  <button class="tab-btn" data-tab="posts">Posts</button>
  <button class="tab-btn" data-tab="insights">Insights</button>
</div>

<main>
  <div id="gateWrap"></div>

  <!-- LISTINGS -->
  <section id="panel-listings" class="panel active">
    <div class="toolbar">
      <input id="listSearch" type="text" placeholder="Search name, owner, or breed…" style="min-width:220px">
      <select id="listSpecies"><option value="">All species</option><option value="Dog">Dogs</option><option value="Cat">Cats</option></select>
      <label class="checkline"><input type="checkbox" id="listPartnerOnly">Partners only</label>
    </div>
    <p class="count-line" id="listCount"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>Pet</th><th>Species / Sex</th><th>Breed</th><th>Owner</th><th>Location</th><th>Listed</th><th>Status</th><th></th></tr></thead>
      <tbody id="listBody"></tbody>
    </table></div>
  </section>

  <!-- USERS -->
  <section id="panel-users" class="panel">
    <p class="count-line" id="userCount"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>Email</th><th>Joined</th><th>Listings</th><th></th></tr></thead>
      <tbody id="userBody"></tbody>
    </table></div>
  </section>

  <!-- PARTNERS -->
  <section id="panel-partners" class="panel">
    <p class="count-line" id="partnerCount"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>Business</th><th>Type</th><th>Contact</th><th>Phone</th><th>City</th><th>Location</th><th>Applied</th><th>Status</th><th></th></tr></thead>
      <tbody id="partnerBody"></tbody>
    </table></div>
  </section>

  <!-- REPORTS -->
  <section id="panel-reports" class="panel">
    <div class="toolbar">
      <select id="reportStatusFilter">
        <option value="open">Open</option>
        <option value="resolved">Resolved</option>
        <option value="dismissed">Dismissed</option>
        <option value="">All</option>
      </select>
    </div>
    <p class="count-line" id="reportCount"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>Listing</th><th>Reason</th><th>Notes</th><th>Reported by</th><th>Reported</th><th>Status</th><th></th></tr></thead>
      <tbody id="reportBody"></tbody>
    </table></div>
  </section>

  <!-- SUBSCRIBERS -->
  <section id="panel-subscribers" class="panel">
    <div class="toolbar">
      <button class="btn btn-ghost" id="copySubscribersBtn" type="button">Copy all emails</button>
    </div>
    <p class="count-line" id="subscriberCount"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>Email</th><th>Source</th><th>Subscribed</th></tr></thead>
      <tbody id="subscriberBody"></tbody>
    </table></div>
  </section>

  <!-- POSTS -->
  <section id="panel-posts" class="panel">
    <div class="postform">
      <h2 id="postFormTitle">New post</h2>
      <form id="postForm">
        <div class="field">
          <label for="postTitle">Title</label>
          <input id="postTitle" type="text" required placeholder="e.g. PetMatch now covers Ibadan">
        </div>
        <div class="field">
          <label for="postBody">Body</label>
          <textarea id="postBody" rows="6" required placeholder="Write your update here. Leave a blank line between paragraphs. Links (https://...) are turned into clickable links automatically."></textarea>
        </div>
        <div class="field">
          <label for="postImage">Image (optional)</label>
          <input id="postImage" type="file" accept="image/*">
          <div id="postImagePreviewWrap" style="display:none">
            <img id="postImagePreviewImg" class="post-thumb-preview" alt="Selected post image preview">
            <button type="button" class="btn btn-ghost btn-sm" id="postImageClearBtn" style="margin-top:6px">Remove image</button>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="postLinkUrl">Link URL (optional)</label>
            <input id="postLinkUrl" type="url" placeholder="https://…">
          </div>
          <div class="field">
            <label for="postLinkLabel">Link label</label>
            <input id="postLinkLabel" type="text" placeholder="e.g. Watch the video">
          </div>
        </div>
        <div class="actions-row">
          <label class="checkline"><input type="checkbox" id="postPublished" checked> Published (visible on /updates)</label>
          <div class="row-actions" style="margin-left:auto">
            <button type="button" class="btn btn-ghost" id="postCancelBtn" style="display:none">Cancel edit</button>
            <button type="submit" class="btn btn-forest" id="postSubmitBtn">Publish post</button>
          </div>
        </div>
        <p class="msg" id="postFormMsg"></p>
      </form>
    </div>

    <p class="count-line" id="postCount"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>Post</th><th>Status</th><th>Posted</th><th></th></tr></thead>
      <tbody id="postsTableBody"></tbody>
    </table></div>
  </section>

  <!-- INSIGHTS -->
  <section id="panel-insights" class="panel">
    <div class="stat-grid" id="insightStats"></div>
    <div class="table-wrap" style="padding:20px 18px">
      <p class="count-line" style="margin-bottom:14px">Page views, last 14 days</p>
      <div class="visit-chart" id="visitChart"></div>
    </div>
  </section>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// =====================================================================
// CONFIG — same Supabase project as index.html
// =====================================================================
const SUPABASE_URL = 'https://pnawdtpavemfjzdsevey.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CHwFvmImO-SxEMDO52uWeA_WUuU1k2l';
// =====================================================================

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let isAdmin = false;
let pets = [];
let users = [];
let partners = [];
let reports = [];
let subscribers = [];
let posts = [];

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}
function waLink(number, petName){
  const intl = String(number ?? '').replace(/[^0-9]/g,'');
  const msg = encodeURIComponent(`Hi, this is PetMatch admin reaching out about your listing for ${petName}.`);
  return `https://wa.me/${intl}?text=${msg}`;
}

// ---------- auth bar ----------
function renderAuthbox(){
  const box = document.getElementById('authbox');
  if(currentUser){
    box.innerHTML = `<span class="who">${escapeHtml(currentUser.email)}</span>
      <button class="btn btn-outline-light" id="signOutBtn">Sign out</button>`;
    document.getElementById('signOutBtn').addEventListener('click', async ()=>{ await supabase.auth.signOut(); });
  } else {
    box.innerHTML = `
      <input type="email" id="authEmail" placeholder="admin@petmatch.fit">
      <button class="btn btn-clay" id="sendLinkBtn">Sign in</button>`;
    document.getElementById('sendLinkBtn').addEventListener('click', async ()=>{
      const email = document.getElementById('authEmail').value.trim();
      const btn = document.getElementById('sendLinkBtn');
      if(!email) return;
      btn.disabled = true; btn.textContent = 'Sending…';
      const { error } = await supabase.auth.signInWithOtp({ email, options:{ emailRedirectTo: window.location.href } });
      btn.textContent = error ? 'Try again' : 'Check your email';
      btn.disabled = false;
    });
  }
}

// ---------- gate / dashboard switch ----------
function renderGate(message){
  document.getElementById('tabs').style.display = 'none';
  document.querySelectorAll('.panel').forEach(p=> p.style.display = 'none');
  document.getElementById('gateWrap').innerHTML = `<div class="gate"><h2>PetMatch Admin</h2><p>${message}</p></div>`;
}
function renderDashboard(){
  document.getElementById('gateWrap').innerHTML = '';
  document.getElementById('tabs').style.display = 'flex';
  const active = document.querySelector('.tab-btn.active')?.dataset.tab || 'listings';
  showTab(active);
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> showTab(btn.dataset.tab));
});
function showTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p=>{
    p.style.display = (p.id === 'panel-'+tab) ? 'block' : 'none';
  });
  if(tab === 'listings') renderListings();
  if(tab === 'users') renderUsers();
  if(tab === 'partners') renderPartners();
  if(tab === 'reports') renderReports();
  if(tab === 'subscribers') renderSubscribers();
  if(tab === 'posts') renderPosts();
  if(tab === 'insights') renderInsights();
}

// ---------- insights (page views) ----------
// Loaded lazily on tab open, not in loadAll() — this queries page_views
// aggregates via security-definer RPCs (admin_visit_stats/admin_visit_daily),
// not the raw table, so it stays cheap regardless of how large that log gets.
async function renderInsights(){
  const statsWrap = document.getElementById('insightStats');
  const chartWrap = document.getElementById('visitChart');
  statsWrap.innerHTML = `<div class="stat-card"><div class="num">…</div><div class="label">Loading</div></div>`;
  chartWrap.innerHTML = '';

  const [statsRes, dailyRes] = await Promise.all([
    supabase.rpc('admin_visit_stats'),
    supabase.rpc('admin_visit_daily', { days: 14 })
  ]);
  const stats = statsRes.data?.[0];

  if(statsRes.error || !stats){
    statsWrap.innerHTML = `<div class="empty"><h3>Couldn't load visit stats</h3><p>${escapeHtml(statsRes.error?.message || 'Unknown error')}</p></div>`;
    return;
  }

  statsWrap.innerHTML = `
    <div class="stat-card"><div class="num">${stats.total_views}</div><div class="label">Total page views</div></div>
    <div class="stat-card"><div class="num">${stats.total_unique_visitors}</div><div class="label">Unique visitors, all-time</div></div>
    <div class="stat-card"><div class="num">${stats.views_today}</div><div class="label">Views today · ${stats.unique_today} unique</div></div>
    <div class="stat-card"><div class="num">${stats.views_7d}</div><div class="label">Views last 7 days · ${stats.unique_7d} unique</div></div>`;

  const daily = dailyRes.data || [];
  if(daily.length === 0){
    chartWrap.innerHTML = `<p class="count-line">No visits recorded yet.</p>`;
    return;
  }
  const maxViews = Math.max(1, ...daily.map(d=> Number(d.views)));
  chartWrap.innerHTML = daily.map(d=>{
    const h = Math.max(2, Math.round((Number(d.views) / maxViews) * 100));
    const label = new Date(d.day).toLocaleDateString(undefined, { month:'short', day:'numeric' });
    return `<div class="visit-bar"><div class="bar" style="height:${h}%" title="${d.views} views · ${d.uniques} unique visitors"></div><span class="bar-label">${label}</span></div>`;
  }).join('');
}

// ---------- data loading ----------
async function loadAll(){
  const [petsRes, usersRes, partnersRes, reportsRes, subscribersRes, postsRes] = await Promise.all([
    supabase.from('pets').select('*').order('created_at', { ascending:false }),
    supabase.rpc('admin_list_users'),
    supabase.from('partner_applications').select('*').order('created_at', { ascending:false }),
    supabase.from('reports').select('*, pets(pet_name, species, breed, owner_name, is_partner)').order('created_at', { ascending:false }),
    supabase.from('subscribers').select('*').order('created_at', { ascending:false }),
    supabase.from('posts').select('*').order('created_at', { ascending:false })
  ]);
  pets = petsRes.data || [];
  users = usersRes.data || [];
  partners = partnersRes.data || [];
  reports = reportsRes.data || [];
  subscribers = subscribersRes.data || [];
  posts = postsRes.data || [];
  showTab(document.querySelector('.tab-btn.active')?.dataset.tab || 'listings');
}

// ---------- listings ----------
function renderListings(){
  const search = document.getElementById('listSearch').value.trim().toLowerCase();
  const species = document.getElementById('listSpecies').value;
  const partnerOnly = document.getElementById('listPartnerOnly').checked;

  const list = pets.filter(p=>{
    if(species && p.species !== species) return false;
    if(partnerOnly && !p.is_partner) return false;
    if(search){
      const hay = `${p.pet_name} ${p.owner_name} ${p.breed}`.toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });

  document.getElementById('listCount').textContent = `${list.length} listing${list.length===1?'':'s'} · ${pets.length} total`;
  const body = document.getElementById('listBody');
  if(list.length === 0){
    body.innerHTML = `<tr><td colspan="8"><div class="empty"><h3>No listings match</h3><p>Try a different search or filter.</p></div></td></tr>`;
    return;
  }
  body.innerHTML = list.map(p=>`
    <tr>
      <td><strong>${escapeHtml(p.pet_name)}</strong>${p.is_partner ? '<br><span class="badge partner">Partner</span>' : ''}</td>
      <td class="nowrap">${p.species} · ${p.gender}</td>
      <td>${escapeHtml(p.breed)}</td>
      <td>${escapeHtml(p.owner_name)}<br><a class="wa-link" target="_blank" rel="noopener" href="${waLink(p.whatsapp, p.pet_name)}">WhatsApp</a></td>
      <td>${escapeHtml(p.state)}</td>
      <td class="muted nowrap">${fmtDate(p.created_at)}</td>
      <td>${p.available_for_mating ? '<span class="badge approved">Available</span>' : '<span class="badge dismissed">Not available</span>'}</td>
      <td><div class="row-actions"><button class="btn btn-clay btn-sm" data-remove-pet="${p.id}">Remove</button></div></td>
    </tr>`).join('');

  body.querySelectorAll('[data-remove-pet]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Remove this listing? This cannot be undone.')) return;
      btn.disabled = true;
      const { error } = await supabase.from('pets').delete().eq('id', btn.dataset.removePet);
      if(error){ alert('Something went wrong: ' + error.message); btn.disabled = false; return; }
      await loadAll();
    });
  });
}

// ---------- partners ----------
// No geocoding service exists to auto-fill partner lat/lng, so this gives
// admins a manual override — used to backfill partners who applied before
// the "Suggested meeting spots" feature existed, or who skipped/denied the
// location prompt on the application form.
let editingPartnerLocationId = null;

function renderPartners(){
  document.getElementById('partnerCount').textContent = `${partners.length} application${partners.length===1?'':'s'}`;
  const body = document.getElementById('partnerBody');
  if(partners.length === 0){
    body.innerHTML = `<tr><td colspan="9"><div class="empty"><h3>No applications yet</h3></div></td></tr>`;
    return;
  }
  body.innerHTML = partners.map(a=>{
    let actions = '';
    if(a.status === 'pending'){
      actions = `<button class="btn btn-forest btn-sm" data-partner-status="${a.id}" data-status="approved">Approve</button>
                 <button class="btn btn-clay btn-sm" data-partner-status="${a.id}" data-status="rejected">Reject</button>`;
    } else if(a.status === 'approved'){
      actions = `<button class="btn btn-ghost btn-sm" data-partner-status="${a.id}" data-status="pending">Revoke</button>`;
    } else {
      actions = `<button class="btn btn-forest btn-sm" data-partner-status="${a.id}" data-status="approved">Approve</button>`;
    }
    const locationCell = editingPartnerLocationId === a.id
      ? `<div style="display:flex; flex-direction:column; gap:6px; min-width:150px">
          <input type="number" step="any" min="-90" max="90" placeholder="Latitude" id="editLat_${a.id}" value="${a.lat ?? ''}" style="width:100%; padding:6px 8px; font-size:12.5px; border:1.5px solid var(--line); border-radius:7px">
          <input type="number" step="any" min="-180" max="180" placeholder="Longitude" id="editLng_${a.id}" value="${a.lng ?? ''}" style="width:100%; padding:6px 8px; font-size:12.5px; border:1.5px solid var(--line); border-radius:7px">
          <div class="row-actions">
            <button class="btn btn-forest btn-sm" data-save-location="${a.id}" type="button">Save</button>
            <button class="btn btn-ghost btn-sm" data-cancel-location type="button">Cancel</button>
          </div>
        </div>`
      : (a.lat != null && a.lng != null
          ? `<span class="muted nowrap">${a.lat.toFixed(4)}, ${a.lng.toFixed(4)}</span><br><button class="btn btn-ghost btn-sm" data-edit-location="${a.id}" type="button">Edit location</button>`
          : `<span class="muted">Not set</span><br><button class="btn btn-ghost btn-sm" data-edit-location="${a.id}" type="button">Add location</button>`);
    return `<tr>
      <td><strong>${escapeHtml(a.business_name)}</strong>${a.website ? `<br><span class="muted">${escapeHtml(a.website)}</span>` : ''}</td>
      <td>${escapeHtml(a.business_type)}</td>
      <td>${escapeHtml(a.contact_name)}<br><span class="muted">${escapeHtml(a.email)}</span></td>
      <td><a class="wa-link" target="_blank" rel="noopener" href="${waLink(a.phone, a.business_name)}">${escapeHtml(a.phone)}</a></td>
      <td>${escapeHtml(a.city)}</td>
      <td>${locationCell}</td>
      <td class="muted nowrap">${fmtDate(a.created_at)}</td>
      <td><span class="badge ${a.status}">${a.status}</span></td>
      <td><div class="row-actions">${actions}</div></td>
    </tr>`;
  }).join('');

  body.querySelectorAll('[data-partner-status]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true;
      const { error } = await supabase.from('partner_applications')
        .update({ status: btn.dataset.status }).eq('id', btn.dataset.partnerStatus);
      if(error){ alert('Something went wrong: ' + error.message); btn.disabled = false; return; }
      await loadAll();
    });
  });
  body.querySelectorAll('[data-edit-location]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ editingPartnerLocationId = btn.dataset.editLocation; renderPartners(); });
  });
  body.querySelectorAll('[data-cancel-location]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ editingPartnerLocationId = null; renderPartners(); });
  });
  body.querySelectorAll('[data-save-location]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.saveLocation;
      const lat = document.getElementById(`editLat_${id}`).value;
      const lng = document.getElementById(`editLng_${id}`).value;
      const latVal = lat === '' ? null : parseFloat(lat);
      const lngVal = lng === '' ? null : parseFloat(lng);
      if((latVal != null && (latVal < -90 || latVal > 90)) || (lngVal != null && (lngVal < -180 || lngVal > 180))){
        alert('Latitude must be between -90 and 90, longitude between -180 and 180.');
        return;
      }
      btn.disabled = true;
      const { error } = await supabase.from('partner_applications').update({ lat: latVal, lng: lngVal }).eq('id', id);
      if(error){ alert('Something went wrong: ' + error.message); btn.disabled = false; return; }
      editingPartnerLocationId = null;
      await loadAll();
    });
  });
}

// ---------- reports ----------
function renderReports(){
  const statusFilter = document.getElementById('reportStatusFilter').value;
  const list = statusFilter ? reports.filter(r=> r.status === statusFilter) : reports;
  document.getElementById('reportCount').textContent = `${list.length} report${list.length===1?'':'s'}`;
  const body = document.getElementById('reportBody');
  if(list.length === 0){
    body.innerHTML = `<tr><td colspan="7"><div class="empty"><h3>Nothing here</h3><p>No reports match this filter.</p></div></td></tr>`;
    return;
  }
  body.innerHTML = list.map(r=>{
    const pet = r.pets;
    const petLabel = pet ? `${escapeHtml(pet.pet_name)} <span class="muted">(${pet.species}, ${escapeHtml(pet.breed)})</span>` : '<span class="muted">Listing removed</span>';
    let actions = '';
    if(r.status === 'open'){
      actions = `<button class="btn btn-ghost btn-sm" data-report-status="${r.id}" data-status="resolved">Resolve</button>
                 <button class="btn btn-ghost btn-sm" data-report-status="${r.id}" data-status="dismissed">Dismiss</button>`;
      if(pet) actions += `<button class="btn btn-clay btn-sm" data-remove-reported-pet="${r.pet_id}" data-report-id="${r.id}">Remove listing</button>`;
    } else {
      actions = `<button class="btn btn-ghost btn-sm" data-report-status="${r.id}" data-status="open">Reopen</button>`;
    }
    return `<tr>
      <td>${petLabel}</td>
      <td>${escapeHtml(r.reason)}</td>
      <td>${escapeHtml(r.notes) || '<span class="muted">None</span>'}</td>
      <td class="muted">${escapeHtml(r.reporter_email) || 'Anonymous'}</td>
      <td class="muted nowrap">${fmtDate(r.created_at)}</td>
      <td><span class="badge ${r.status}">${r.status}</span></td>
      <td><div class="row-actions">${actions}</div></td>

  }).join('');

  body.querySelectorAll('[data-report-status]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true;

        .update({ status: btn.dataset.status }).eq('id', btn.dataset.reportStatus);

      await loadAll();

      btn.disabled = true;
      const { error } = await supabase.from('pets').delete().eq('id', btn.dataset.removeReportedPet);
      if(error){ alert('Something went wrong: ' + error.message); btn.disabled = false; return; }
      await supabase.from('reports').update({ status:'resolved' }).eq('id', btn.dataset.reportId);
      await loadAll();
    });
  });
}
document.getElementById('reportStatusFilter').addEventListener('change', renderReports);

// ---------- posts ----------
// Same client-side resize as the pet-photo uploader in index.html — phone
// photos routinely run several MB and nothing here needs more than
// ~1280px on the long edge for a card image.
async function compressImage(file, { maxDim = 1280, quality = 0.82 } = {}){
  if(!file || !file.type.startsWith('image/')) return file;
  try{
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    const w = Math.round(bitmap.width * scale);
    const h = Math.round(bitmap.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
    if(!blob || blob.size >= file.size) return file;
    const base = file.name.replace(/\.\w+$/, '') || 'photo';
    return new File([blob], `${base}.jpg`, { type: 'image/jpeg' });
  } catch {
    return file;
  }
}

let editingPostId = null;
let editingPostImageUrl = null;
let selectedPostImageFile = null;

function setSelectedPostImage(file){
  selectedPostImageFile = file;
  const wrap = document.getElementById('postImagePreviewWrap');
  const img = document.getElementById('postImagePreviewImg');
  if(file){
    img.src = URL.createObjectURL(file);
    wrap.style.display = 'block';
  } else if(editingPostImageUrl){
    img.src = editingPostImageUrl;
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
    img.src = '';
  }
}
document.getElementById('postImage').addEventListener('change', (e)=>{
  setSelectedPostImage(e.target.files[0] || null);
});
document.getElementById('postImageClearBtn').addEventListener('click', ()=>{
  document.getElementById('postImage').value = '';
  editingPostImageUrl = null;
  setSelectedPostImage(null);
});

function resetPostForm(){
  editingPostId = null;
  editingPostImageUrl = null;
  selectedPostImageFile = null;
  document.getElementById('postForm').reset();
  document.getElementById('postPublished').checked = true;
  setSelectedPostImage(null);
  document.getElementById('postFormTitle').textContent = 'New post';
  document.getElementById('postSubmitBtn').textContent = 'Publish post';
  document.getElementById('postCancelBtn').style.display = 'none';
  document.getElementById('postFormMsg').textContent = '';
}
document.getElementById('postCancelBtn').addEventListener('click', resetPostForm);

function startEditPost(id){
  const p = posts.find(x=> x.id === id);
  if(!p) return;
  editingPostId = id;
  editingPostImageUrl = p.image_url || null;
  selectedPostImageFile = null;
  document.getElementById('postTitle').value = p.title;
  document.getElementById('postBody').value = p.body;
  document.getElementById('postLinkUrl').value = p.link_url || '';
  document.getElementById('postLinkLabel').value = p.link_label || '';
  document.getElementById('postPublished').checked = !!p.published;
  document.getElementById('postImage').value = '';
  setSelectedPostImage(null);
  document.getElementById('postFormTitle').textContent = 'Edit post';
  document.getElementById('postSubmitBtn').textContent = 'Save changes';
  document.getElementById('postCancelBtn').style.display = '';
  document.getElementById('postFormMsg').textContent = '';
  document.getElementById('panel-posts').scrollIntoView({ behavior:'smooth', block:'start' });
}

document.getElementById('postForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!currentUser) return;
  const msg = document.getElementById('postFormMsg');
  const submitBtn = document.getElementById('postSubmitBtn');
  submitBtn.disabled = true;
  msg.textContent = 'Saving…';

  let image_url = editingPostImageUrl;
  if(selectedPostImageFile){
    msg.textContent = 'Optimizing image…';
    const compressed = await compressImage(selectedPostImageFile);
    msg.textContent = 'Saving…';
    const path = `${currentUser.id}/${Date.now()}-${compressed.name}`;
    const { error: upErr } = await supabase.storage.from('post-images').upload(path, compressed);
    if(upErr){
      msg.textContent = 'Image upload failed: ' + upErr.message;
      submitBtn.disabled = false;
      return;
    }
    image_url = supabase.storage.from('post-images').getPublicUrl(path).data.publicUrl;
  }

  const row = {
    title: document.getElementById('postTitle').value.trim(),
    body: document.getElementById('postBody').value.trim(),
    image_url,
    link_url: document.getElementById('postLinkUrl').value.trim() || null,
    link_label: document.getElementById('postLinkLabel').value.trim() || null,
    published: document.getElementById('postPublished').checked,
    author_email: currentUser.email
  };

  const { error } = editingPostId
    ? await supabase.from('posts').update(row).eq('id', editingPostId)
    : await supabase.from('posts').insert(row);

  if(error){
    msg.textContent = 'Something went wrong: ' + error.message;
    submitBtn.disabled = false;
    return;
  }
  submitBtn.disabled = false;
  resetPostForm();
  await loadAll();
});

function renderPosts(){
  document.getElementById('postCount').textContent = `${posts.length} post${posts.length===1?'':'s'}`;
  const body = document.getElementById('postsTableBody');
  if(posts.length === 0){
    body.innerHTML = `<tr><td colspan="4"><div class="empty"><h3>No posts yet</h3><p>Use the form above to publish your first update.</p></div></td></tr>`;
    return;
  }
  body.innerHTML = posts.map(p=>`
    <tr>
      <td>${p.image_url ? `<img class="post-thumb" src="${p.image_url}" alt="">` : ''}<strong>${escapeHtml(p.title)}</strong></td>
      <td><span class="badge ${p.published ? 'approved' : 'pending'}">${p.published ? 'Published' : 'Draft'}</span></td>
      <td class="muted nowrap">${fmtDate(p.created_at)}</td>
      <td><div class="row-actions">
        <button class="btn btn-ghost btn-sm" data-edit-post="${p.id}">Edit</button>
        <button class="btn btn-ghost btn-sm" data-toggle-post="${p.id}">${p.published ? 'Unpublish' : 'Publish'}</button>
        <button class="btn btn-clay btn-sm" data-remove-post="${p.id}">Delete</button>
      </div></td>
    </tr>`).join('');

  body.querySelectorAll('[data-edit-post]').forEach(btn=>{
    btn.addEventListener('click', ()=> startEditPost(btn.dataset.editPost));
  });
  body.querySelectorAll('[data-toggle-post]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true;
      const p = posts.find(x=> x.id === btn.dataset.togglePost);
      const { error } = await supabase.from('posts').update({ published: !p.published }).eq('id', btn.dataset.togglePost);
      if(error){ alert('Something went wrong: ' + error.message); btn.disabled = false; return; }
      await loadAll();
    });
  });
  body.querySelectorAll('[data-remove-post]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Delete this post? This cannot be undone.')) return;
      btn.disabled = true;
      const { error } = await supabase.from('posts').delete().eq('id', btn.dataset.removePost);
      if(error){ alert('Something went wrong: ' + error.message); btn.disabled = false; return; }
      if(editingPostId === btn.dataset.removePost) resetPostForm();
      await loadAll();
    });
  });
}

// ---------- admin badge lookup for the Users tab ----------
let adminEmails = new Set();
async function loadAdminEmails(){
  if(!currentUser) return;
  const { data } = await supabase.from('admins').select('email').eq('email', currentUser.email);
  adminEmails = new Set((data || []).map(r=> r.email.toLowerCase()));
}

// ---------- admin check + boot ----------
async function checkAdminAndBoot(){
  if(!currentUser){
    renderGate('Sign in above with an admin account to continue.');
    return;
  }
  const { data } = await supabase.from('admins').select('email').eq('email', currentUser.email);
  isAdmin = !!(data && data.length);
  if(!isAdmin){
    renderGate(`${escapeHtml(currentUser.email)} doesn't have admin access yet. Ask an existing admin to add your email, or sign in with a different account.`);
    return;
  }
  await loadAdminEmails();
  renderDashboard();
  await loadAll();
}

supabase.auth.onAuthStateChange((_event, session)=>{
  currentUser = session?.user ?? null;
  renderAuthbox();
  checkAdminAndBoot();
});

// ---------- realtime: keep the dashboard fresh ----------
supabase.channel('admin-changes')
  .on('postgres_changes', { event:'*', schema:'public', table:'pets' }, ()=>{ if(isAdmin) loadAll(); })
  .on('postgres_changes', { event:'*', schema:'public', table:'partner_applications' }, ()=>{ if(isAdmin) loadAll(); })
  .on('postgres_changes', { event:'*', schema:'public', table:'reports' }, ()=>{ if(isAdmin) loadAll(); })
  .on('postgres_changes', { event:'*', schema:'public', table:'subscribers' }, ()=>{ if(isAdmin) loadAll(); })
  .on('postgres_changes', { event:'*', schema:'public', table:'posts' }, ()=>{ if(isAdmin) loadAll(); })
  .subscribe();

// ---------- init ----------
(async function init(){
  renderGate('Checking your session…');
  const { data:{ session } } = await supabase.auth.getSession();
  currentUser = session?.user ?? null;
  renderAuthbox();
  await checkAdminAndBoot();
})();
</script>
